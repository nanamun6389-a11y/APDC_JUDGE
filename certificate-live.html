<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APDC 2027 Certificate Print</title><link rel="stylesheet" href="style.css"><style>
body{background:#f3f3f3}.wrap{max-width:1120px;margin:auto;padding:22px}.toolbar{background:#fff;border:1px solid #bbb;padding:18px;margin-bottom:14px}.toolbar h1{margin:3px 0 10px}.toolbar select{width:100%;padding:12px;margin:6px 0 12px}.toolbar button,.toolbar a{display:inline-block;padding:11px 14px;border:1px solid #111;background:#111;color:#fff;text-decoration:none;font-weight:900;margin-right:6px}.list{background:#fff;border:1px solid #bbb}.row{display:grid;grid-template-columns:44px 70px 1fr 1.4fr 70px;gap:8px;padding:11px;border-bottom:1px solid #eee;align-items:center}.batch{display:none}.cert{position:relative;width:210mm;height:297mm;background:#fff;page-break-after:always;overflow:hidden;padding:24mm 20mm;box-sizing:border-box;font-family:Georgia,'Times New Roman',serif}.frame{position:absolute;inset:10mm;border:1.2mm solid #111}.inner{position:absolute;inset:15mm;border:.3mm solid #888}.cbody{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;text-align:center;align-items:center}.mark{font:900 12mm Arial,sans-serif;letter-spacing:.12em;margin-top:8mm}.year{font:700 4mm Arial,sans-serif;letter-spacing:.18em;margin-top:2mm}.title{font-size:10mm;font-weight:700;margin-top:21mm}.subtitle{font:600 4mm Arial,sans-serif;letter-spacing:.15em;margin-top:3mm}.name{font-size:12mm;font-weight:700;border-bottom:.5mm solid #111;min-width:130mm;padding:0 4mm 3mm;margin-top:20mm}.award{font:700 6mm Arial,sans-serif;margin-top:11mm}.place{font-size:15mm;font-weight:700;margin-top:3mm}.event{font-size:6mm;font-weight:700;max-width:150mm;margin-top:9mm;line-height:1.35}.text{font:4mm/1.7 Arial,sans-serif;max-width:150mm;margin-top:11mm}.date{font:600 4mm Arial,sans-serif;margin-top:auto;margin-bottom:10mm}.sign{display:flex;width:100%;justify-content:space-between;font:700 3.6mm Arial,sans-serif;padding:0 15mm 5mm;box-sizing:border-box}.foot{font:700 3mm Arial,sans-serif;letter-spacing:.12em}@media print{body>*:not(.batch){display:none!important}.batch{display:block}.cert{margin:0;box-shadow:none}.cert:last-child{page-break-after:auto}}
</style></head><body><header><a class="brand brand-link" href="admin.html">APDC 2027 CERTIFICATE</a></header><main class="wrap"><div class="toolbar"><div class="small-label">2027 APDC AWARD PRINT</div><h1>상장 출력</h1><div id="meta"></div><p class="muted">FINAL 결과가 저장된 선수만 자동으로 불러옵니다. 2027 대회용 새 양식입니다.</p><label>EVENT<select id="event"></select></label><label><input id="all" type="checkbox"> 전체 선택</label><div><button id="print">선택 상장 출력</button><a id="resultLink" href="live-results.html">RESULT 확인</a></div><span id="msg"></span></div><div id="list" class="list"></div></main><div id="batch" class="batch"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getDatabase,ref as fbRef,get}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';import{firebaseConfig}from'./firebase-config.js';import{competitionPath,competitionId}from'./competition-context.js';const db=getDatabase(initializeApp(firebaseConfig)),ref=p=>fbRef(db,competitionPath(p));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const eventSelect=document.getElementById('event'),all=document.getElementById('all'),printBtn=document.getElementById('print'),list=document.getElementById('list'),batch=document.getElementById('batch'),resultLink=document.getElementById('resultLink');const q=`?competition=${encodeURIComponent(competitionId)}`;resultLink.href='live-results.html'+q;
const [rs,es,ms,ss]=await Promise.all([get(ref('results')),get(ref('entries')),get(ref('meta')),get(ref('eventSettings'))]);const results=rs.val()||{},entries=Object.values(es.val()||{}),meta=ms.val()||{},settings=ss.val()||{};document.getElementById('meta').textContent=`${meta.name||'2027 APDC'}${meta.date?' · '+meta.date:''}${meta.venue?' · '+meta.venue:''}`;
const finals=[];for(const [encoded,ev] of Object.entries(results)){const f=ev?.final;if(!f?.ranking)continue;const setting=Object.values(settings).find(x=>x?.eventKey===f.eventKey)||{};const [event,section,style]=String(f.eventKey||'').split('||');const by=new Map(entries.filter(x=>x&&x.event===event&&x.section===section&&x.style===style).map(x=>[String(x.backNo),x]));for(const r of f.ranking){const e=by.get(String(r.backNo))||{};finals.push({eventNo:setting.eventNumber||'',event:f.eventLabel?.replace(/\s*✓ SUBMITTED$/,'')||setting.event||event||encoded,backNo:String(r.backNo),name:e.competitor||String(r.backNo),place:Number(r.place)||0})}}
finals.sort((a,b)=>(Number(a.eventNo)||999999)-(Number(b.eventNo)||999999)||a.place-b.place);const sel=eventSelect;const evs=[...new Map(finals.map(x=>[`${x.eventNo}|${x.event}`,x])).values()];sel.innerHTML='<option value="">ALL EVENTS</option>'+evs.map(x=>`<option value="${esc(x.eventNo+'|'+x.event)}">EVENT ${esc(x.eventNo||'—')} · ${esc(x.event)}</option>`).join('');function rows(){return finals.filter(x=>!sel.value||`${x.eventNo}|${x.event}`===sel.value)}function render(){list.innerHTML=rows().map((r,i)=>`<div class="row"><input type="checkbox" data-i="${i}"><b>#${esc(r.backNo)}</b><span>${esc(r.name)}</span><span>EVENT ${esc(r.eventNo||'—')} · ${esc(r.event)}</span><b>${r.place}</b></div>`).join('')||'<div style="padding:26px">저장된 FINAL 결과가 없습니다.</div>'}render();sel.onchange=render;all.onchange=e=>document.querySelectorAll('[data-i]').forEach(x=>x.checked=e.target.checked);const ord=n=>n===1?'1ST':n===2?'2ND':n===3?'3RD':`${n}TH`;const cert=r=>`<section class="cert"><div class="frame"></div><div class="inner"></div><div class="cbody"><div class="mark">APDC</div><div class="year">2027 ASIA PACIFIC DANCESPORT CHAMPIONSHIP</div><div class="title">CERTIFICATE</div><div class="subtitle">OF ACHIEVEMENT</div><div class="name">${esc(r.name)}</div><div class="award">IS AWARDED</div><div class="place">${ord(r.place)}</div><div class="event">EVENT ${esc(r.eventNo||'—')} · ${esc(r.event)}</div><div class="text">In recognition of outstanding performance at the<br>2027 Asia Pacific Dancesport Championship.</div><div class="date">${esc(meta.date||'2027')} ${meta.venue?' · '+esc(meta.venue):''}</div><div class="sign"><span>ORGANIZER</span><span>APDC</span></div><div class="foot">ASIA PACIFIC DANCESPORT CHAMPIONSHIP</div></div></section>`;printBtn.onclick=()=>{const rr=rows(),picked=[...document.querySelectorAll('[data-i]:checked')].map(x=>rr[Number(x.dataset.i)]).filter(Boolean);if(!picked.length)return alert('출력할 결과를 선택하세요.');batch.innerHTML=picked.map(cert).join('');setTimeout(()=>window.print(),100)};
</script></body></html>
