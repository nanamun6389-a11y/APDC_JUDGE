<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>APDC Competition System</title><link rel="stylesheet" href="style.css">
<style>.comp-main{width:min(980px,100%);margin:0 auto;padding:32px 18px 70px}.comp-hero{padding:30px 0 22px;border-bottom:2px solid #111}.comp-hero h1{font-size:clamp(34px,7vw,64px);margin:6px 0}.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.comp-card{border:1px solid #bbb;background:#fff;padding:22px;text-decoration:none;color:#111;display:block}.comp-card strong{display:block;font-size:22px;margin:7px 0}.comp-card p{margin:0;color:#666;font-size:13px;line-height:1.6}.comp-card.primary{background:#111;color:#fff}.comp-card.primary p{color:#ddd}.past-title{margin:38px 0 12px;font-size:12px;letter-spacing:.12em}.archive-row{border:1px solid #ccc;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;color:#111}.archive-row .tag{font-size:10px;font-weight:900;letter-spacing:.08em;border:1px solid #111;padding:5px 7px}.archive-row h2{margin:2px 0 4px;font-size:20px}.archive-row p{margin:0;color:#666;font-size:12px}.active-list{display:grid;gap:10px;margin-top:12px}.loading{padding:18px;border:1px solid #ddd;color:#777}.newbtn{margin-top:12px;display:block;text-align:center;border:1px solid #111;padding:15px;text-decoration:none;color:#111;font-weight:900}@media(max-width:680px){.comp-grid{grid-template-columns:1fr}.comp-main{padding-top:18px}}</style></head><body>
<header style="position:relative"><a class="brand brand-link" href="index.html">APDC COMPETITION SYSTEM</a></header><main class="comp-main"><section class="comp-hero"><div class="small-label">COMPETITION MANAGEMENT</div><h1>APDC JUDGE</h1><p class="muted">진행 중인 대회를 불러와 이어서 작업하거나 새 대회를 만듭니다.</p></section>
<div class="past-title">ACTIVE COMPETITIONS · 진행 중인 대회</div><div id="activeList" class="active-list"><div class="loading">Firebase에서 대회를 불러오는 중...</div></div><a class="newbtn" href="new-competition.html">+ 새 대회 만들기</a>
<div class="past-title">PAST COMPETITIONS · 지난 대회</div><a class="archive-row" href="past-2026.html"><div><div class="small-label">AUGUST 8, 2026</div><h2>2026 APDC</h2><p>엔트리 · 타임테이블 · 최종 결과 보관본</p></div><span class="tag">READ ONLY</span></a></main>
<script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';import {firebaseConfig} from './firebase-config.js';import {setActiveCompetition} from './competition-context.js';
const host=document.getElementById('activeList');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
try{const db=getDatabase(initializeApp(firebaseConfig));const snap=await get(ref(db,'competitions'));const data=snap.val()||{};const local=(()=>{try{return JSON.parse(localStorage.getItem('apdc-competitions-v2')||'[]')}catch{return[]}})();const rows=Object.entries(data).filter(([id])=>id!=='2026-apdc').map(([id,v])=>{const lm=Array.isArray(local)?local.find(x=>x&&x.id===id):null;const meta=(v&&v.meta)||lm||{};const entries=v&&v.entries?Object.keys(v.entries).length:0;const tt=v&&v.timetableOverride?(Array.isArray(v.timetableOverride)?v.timetableOverride.length:Object.keys(v.timetableOverride).length):0;return{id,name:meta.name||id,date:meta.date||'',venue:meta.venue||'',entries,tt}});if(!rows.length){host.innerHTML='<div class="loading">진행 중인 대회가 없습니다. 아래에서 새 대회를 만들어주세요.</div>'}else{host.innerHTML=rows.map(r=>`<a class="archive-row activeCompetition" data-id="${esc(r.id)}" href="admin.html?competition=${encodeURIComponent(r.id)}&tab=entries"><div><div class="small-label">${esc(r.date||'IN PROGRESS')}</div><h2>${esc(r.name)}</h2><p>${r.entries} ENTRIES · 저장된 작업 계속하기</p></div><span class="tag">OPEN</span></a>`).join('');host.querySelectorAll('.activeCompetition').forEach(a=>a.addEventListener('click',()=>setActiveCompetition(a.dataset.id)))}}catch(e){console.error(e);host.innerHTML='<div class="loading">대회 목록을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.</div>'}
</script></body></html>
