<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>New Competition</title><link rel="stylesheet" href="style.css"><style>
.new-wrap{width:min(760px,100%);margin:auto;padding:28px 18px 70px}.new-card{border:1px solid #ccc;padding:22px;background:#fff}.new-card label{display:block;margin:14px 0;font-weight:900;font-size:11px;letter-spacing:.06em}.new-card input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px}.new-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.new-actions button,.new-actions a{flex:1;min-width:150px;text-align:center;padding:13px;text-decoration:none;box-sizing:border-box}.saved{margin-top:14px;font-weight:900;line-height:1.45}.result{display:none;margin-top:18px;border-top:1px solid #ddd;padding-top:18px}.result.show{display:block}.comp-id{font:700 13px ui-monospace,monospace;background:#f4f4f4;padding:10px;word-break:break-all}.primaryGo{display:block;background:#000;color:#fff;text-decoration:none;text-align:center;padding:15px;margin-top:14px;font-weight:900}.hint{font-size:12px;color:#666;line-height:1.5;margin-top:8px}@media(max-width:600px){.new-actions{display:grid;grid-template-columns:1fr}.new-actions button,.new-actions a{width:100%}}</style></head><body>
<header><a class="brand brand-link" href="index.html">APDC COMPETITION SYSTEM</a></header><main class="new-wrap"><div class="small-label">NEW COMPETITION</div><h1>CREATE COMPETITION</h1><p class="muted">새 대회는 2026 기록과 분리해서 생성합니다. 대회명을 저장하면 바로 엔트리 등록 화면으로 이동합니다.</p>
<section class="new-card"><label>COMPETITION NAME<input id="name" placeholder="2027 APDC" autocomplete="off"></label><label>DATE<input id="date" type="date"></label><label>VENUE<input id="venue" placeholder="Venue" autocomplete="off"></label><label>COMPETITION ID<input id="cid" placeholder="대회명에서 자동 생성" autocomplete="off"></label><div class="hint">예: 2027 APDC → 2027-apdc. 2026-apdc는 지난 대회 보관용이라 사용할 수 없습니다.</div><div class="new-actions"><a class="light" href="index.html">CANCEL</a><button id="create" class="dark" type="button">새 대회 만들기</button></div><div id="msg" class="saved"></div></section></main>
<script type="module">
import { setActiveCompetition } from './competition-context.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';
import { firebaseConfig } from './firebase-config.js';
const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id); let draft=null;
function slug(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]+/g,'-').replace(/^-+|-+$/g,'')}
$('name').addEventListener('input',()=>{if(!$('cid').dataset.manual)$('cid').value=slug($('name').value)});
$('cid').addEventListener('input',()=>{$('cid').dataset.manual='1'});
$('create').onclick=async()=>{try{const name=$('name').value.trim();if(!name){$('msg').textContent='대회명을 입력해주세요.';$('name').focus();return}const id=slug($('cid').value||name);if(!id){$('msg').textContent='COMPETITION ID를 확인해주세요.';return}if(id==='2026-apdc'){$('msg').textContent='2026-apdc는 지난 대회 보관용입니다. 다른 ID를 사용해주세요.';return}const draft={id,name,date:$('date').value,venue:$('venue').value.trim(),status:'SETUP',storageMode:'NAMESPACED_FIREBASE',firebaseRoot:`competitions/${id}`,createdAt:new Date().toISOString()};let all=[];try{all=JSON.parse(localStorage.getItem('apdc-competitions-v2')||'[]');if(!Array.isArray(all))all=[]}catch(e){all=[]}all=all.filter(x=>x&&x.id!==id);all.push(draft);localStorage.setItem('apdc-competitions-v2',JSON.stringify(all));await set(ref(db,`competitions/${id}/meta`),draft);setActiveCompetition(id);location.href=`admin.html?competition=${encodeURIComponent(id)}&tab=entries`;}catch(err){console.error(err);$('msg').textContent='생성 중 오류가 발생했습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.'}};
</script></body></html>
