<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>APDC Live Results</title><link rel="stylesheet" href="style.css"><style>
body{background:#f5f5f5}.results-main{width:min(1050px,100%);margin:auto;padding:24px 16px 70px}.hero{background:#111;color:#fff;padding:24px;margin-bottom:14px}.hero h1{font-size:clamp(34px,8vw,64px);margin:4px 0}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid #888;padding:7px 9px;font-size:11px;font-weight:900}.tools{display:flex;gap:8px;margin:14px 0}.tools input{flex:1;padding:13px;border:1px solid #aaa}.event-card{background:#fff;border:1px solid #ccc;margin:10px 0}.event-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px;border-bottom:1px solid #eee}.event-no{font-size:11px;font-weight:900;letter-spacing:.08em}.event-name{font-size:20px;font-weight:900;margin-top:3px}.badge{padding:6px 8px;border:1px solid #111;font-size:10px;font-weight:900;white-space:nowrap}.badge.done{background:#111;color:#fff}.rounds{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #eee}.round{font-size:10px;border:1px solid #bbb;padding:5px 7px}.round.ok{border-color:#111;font-weight:900}.ranking{display:grid}.rank-row{display:grid;grid-template-columns:55px 70px 1fr;gap:8px;padding:10px 16px;border-top:1px solid #eee;align-items:center}.rank-row:first-child{border-top:0}.place{font-size:18px;font-weight:900}.empty{padding:18px;color:#777}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{border:1px solid #111;padding:9px 11px;color:#111;text-decoration:none;font-size:11px;font-weight:900}@media(max-width:600px){.rank-row{grid-template-columns:44px 58px 1fr}.event-name{font-size:16px}}
</style></head><body><header><a class="brand brand-link" href="index.html">APDC RESULTS</a></header><main class="results-main"><div class="nav"><a id="judgeLink" href="judge-live.html">JUDGE</a><a id="certLink" href="certificate-live.html">CERTIFICATE PRINT</a><a id="adminLink" href="admin.html">ADMIN</a></div><section class="hero"><div class="small-label">LIVE COMPETITION RESULTS</div><h1>RESULTS</h1><div id="meta">Loading competition…</div><div class="summary"><span id="completeCount" class="pill">완료 0</span><span id="remainingCount" class="pill">남은 경기 0</span></div></section><div class="tools"><input id="search" type="search" placeholder="이벤트 번호 / 이벤트명 / 백넘버 / 선수명 검색"></div><div id="list"><div class="empty">결과를 불러오는 중…</div></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getDatabase,ref as fbRef,onValue,get}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';import{firebaseConfig}from'./firebase-config.js';import{competitionPath,competitionId}from'./competition-context.js';
const db=getDatabase(initializeApp(firebaseConfig)),ref=p=>fbRef(db,competitionPath(p));const enc=k=>btoa(unescape(encodeURIComponent(String(k||'')))).replaceAll('=','');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const judgeLink=document.getElementById('judgeLink'),certLink=document.getElementById('certLink'),adminLink=document.getElementById('adminLink'),completeCount=document.getElementById('completeCount'),remainingCount=document.getElementById('remainingCount'),search=document.getElementById('search'),list=document.getElementById('list');
const q=`?competition=${encodeURIComponent(competitionId)}`;judgeLink.href='judge-live.html'+q;certLink.href='certificate-live.html'+q;adminLink.href='admin.html'+q+'&tab=results';
let entries=[],settings={},results={},subs={},meta={};
function competitors(key){const [event,section,style]=key.split('||');const m=new Map();entries.filter(x=>x&&x.event===event&&x.section===section&&x.style===style).forEach(x=>m.set(String(x.backNo),{backNo:String(x.backNo),name:x.competitor||''}));return m}
function events(){const a=[];for(const v of Object.values(settings||{})){if(!v?.eventKey)continue;a.push({key:v.eventKey,no:v.eventNumber||'',name:v.event||v.eventKey,assigned:v.assignedJudges||[]})}return a.sort((x,y)=>(Number(x.no)||999999)-(Number(y.no)||999999)||String(x.name).localeCompare(String(y.name),undefined,{numeric:true}))}
function roundStatus(ev,r){const bucket=subs[`${enc(ev.key)}_${r}`]||{};const done=ev.assigned.filter(j=>bucket[j]).length;return{done,total:ev.assigned.length,complete:ev.assigned.length>0&&done===ev.assigned.length}}
function render(){const term=search.value.trim().toLowerCase();const evs=events();let finalDone=0;const html=[];for(const ev of evs){const saved=results?.[enc(ev.key)]||{};const final=saved.final;const qst=roundStatus(ev,'quarter'),sst=roundStatus(ev,'semi'),fst=roundStatus(ev,'final');const complete=!!final?.ranking?.length||fst.complete;if(complete)finalDone++;const map=competitors(ev.key);const ranking=(final?.ranking||[]).map(r=>({...r,name:map.get(String(r.backNo))?.name||''}));const hay=[ev.no,ev.name,...ranking.flatMap(r=>[r.backNo,r.name])].join(' ').toLowerCase();if(term&&!hay.includes(term))continue;html.push(`<section class="event-card"><div class="event-head"><div><div class="event-no">EVENT ${esc(ev.no||'—')}</div><div class="event-name">${esc(ev.name)}</div></div><span class="badge ${complete?'done':''}">${complete?'COMPLETE ✓':'남은 경기'}</span></div><div class="rounds"><span class="round ${qst.complete?'ok':''}">QF ${qst.done}/${qst.total}</span><span class="round ${sst.complete?'ok':''}">SF ${sst.done}/${sst.total}</span><span class="round ${fst.complete?'ok':''}">FINAL ${fst.done}/${fst.total}</span></div>${ranking.length?`<div class="ranking">${ranking.map(r=>`<div class="rank-row"><span class="place">${r.place}</span><b>#${esc(r.backNo)}</b><span>${esc(r.name)}</span></div>`).join('')}</div>`:`<div class="empty">${complete?'최종 결과 계산 중 또는 저장 대기':'아직 완료되지 않은 경기입니다.'}</div>`}</section>`)}completeCount.textContent=`완료 ${finalDone}`;remainingCount.textContent=`남은 경기 ${Math.max(0,evs.length-finalDone)}`;list.innerHTML=html.join('')||'<div class="empty">표시할 이벤트가 없습니다.</div>'}
search.oninput=render;onValue(ref('entries'),s=>{entries=Object.values(s.val()||{}).filter(Boolean);render()});onValue(ref('eventSettings'),s=>{settings=s.val()||{};render()});onValue(ref('results'),s=>{results=s.val()||{};render()});onValue(ref('submissions'),s=>{subs=s.val()||{};render()});get(ref('meta')).then(s=>{meta=s.val()||{};document.getElementById('meta').textContent=`${meta.name||competitionId}${meta.date?' · '+meta.date:''}${meta.venue?' · '+meta.venue:''}`});
</script></body></html>
