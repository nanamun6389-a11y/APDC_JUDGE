<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>New Competition</title><link rel="stylesheet" href="style.css"><style>
.new-wrap{width:min(760px,100%);margin:auto;padding:28px 18px 70px}.new-card{border:1px solid #ccc;padding:22px;background:#fff}.new-card label{display:block;margin:14px 0;font-weight:900;font-size:11px;letter-spacing:.06em}.new-card input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px}.new-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.new-actions button,.new-actions a{flex:1;min-width:150px;text-align:center;padding:13px;text-decoration:none}.saved{margin-top:14px;font-weight:900}.result{display:none;margin-top:18px;border-top:1px solid #ddd;padding-top:18px}.result.show{display:block}.comp-id{font:700 13px ui-monospace,monospace;background:#f4f4f4;padding:10px;word-break:break-all}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.links a{border:1px solid #111;padding:11px;text-decoration:none;color:#111;text-align:center;font-size:12px;font-weight:800}@media(max-width:600px){.links{grid-template-columns:1fr}}</style></head><body>
<header><a class="brand brand-link" href="index.html">APDC COMPETITION SYSTEM</a></header><main class="new-wrap"><div class="small-label">NEW COMPETITION</div><h1>CREATE COMPETITION</h1><p class="muted">새 대회는 별도 Firebase 경로로 운영됩니다. 2026 APDC 기록은 변경되지 않습니다.</p>
<section class="new-card"><label>COMPETITION NAME<input id="name" placeholder="2027 APDC"></label><label>DATE<input id="date" type="date"></label><label>VENUE<input id="venue" placeholder="Venue"></label><label>COMPETITION ID<input id="cid" placeholder="자동 생성됩니다"></label><div class="new-actions"><a class="light" href="index.html">CANCEL</a><button id="create" class="dark" type="button">CREATE DRAFT</button></div><div id="msg" class="saved"></div>
<div id="result" class="result"><div class="small-label">ACTIVE COMPETITION ID</div><div id="createdId" class="comp-id"></div><p class="muted">이 ID가 새 대회의 모든 실시간 Firebase 데이터 경로 앞에 붙습니다.</p><div class="links"><a id="adminLink">ADMIN</a><a id="judgeLink">JUDGE</a><a id="controlLink">CONTROL ROOM</a><a id="mcLink">MC</a></div><div class="new-actions"><button id="download" type="button">DOWNLOAD CONFIG JSON</button><a id="homeLink" class="dark">USE THIS COMPETITION</a></div></div></section></main>
<script type="module">
import { setActiveCompetition } from './competition-context.js';
const $=id=>document.getElementById(id); let draft=null;
function slug(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]+/g,'-').replace(/^-+|-+$/g,'')}
$('name').addEventListener('input',()=>{if(!$('cid').dataset.manual)$('cid').value=slug($('name').value)});
$('cid').addEventListener('input',()=>{$('cid').dataset.manual='1'});
$('create').onclick=()=>{const name=$('name').value.trim();if(!name){$('msg').textContent='대회명을 입력해주세요.';return}const id=slug($('cid').value||name);if(!id||id==='2026-apdc'){$('msg').textContent='2026-apdc는 보관용 ID입니다. 다른 ID를 사용해주세요.';return}draft={id,name,date:$('date').value,venue:$('venue').value.trim(),status:'DRAFT',storageMode:'NAMESPACED_FIREBASE',firebaseRoot:`competitions/${id}`,createdAt:new Date().toISOString()};const all=JSON.parse(localStorage.getItem('apdc-competitions-v2')||'[]').filter(x=>x.id!==id);all.push(draft);localStorage.setItem('apdc-competitions-v2',JSON.stringify(all));setActiveCompetition(id);$('createdId').textContent=id;[['adminLink','admin.html'],['judgeLink','judge-live.html'],['controlLink','control-room.html'],['mcLink','mc.html'],['homeLink','index.html']].forEach(([el,page])=>$(el).href=`${page}?competition=${encodeURIComponent(id)}`);$('result').classList.add('show');$('msg').textContent='새 대회 DRAFT가 생성되었습니다. 설정 화면으로 이동합니다.';setTimeout(()=>{location.href=`competition-setup.html?competition=${encodeURIComponent(id)}`},350)};
$('download').onclick=()=>{if(!draft)return;const b=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${draft.id}-competition.json`;a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
