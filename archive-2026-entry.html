<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 APDC Entry Archive</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(1000px,100%);margin:auto;padding:24px 16px 60px}.tools{display:flex;gap:8px;margin:18px 0}.tools input{width:100%;padding:13px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:75px 1fr 1.3fr;gap:10px;border:1px solid #ddd;padding:12px;background:#fff}.no{font-weight:900;font-size:18px}.sub{font-size:11px;color:#666;margin-top:3px}@media(max-width:650px){.row{grid-template-columns:62px 1fr}.event{grid-column:2}}</style></head><body><header><a class="brand brand-link" href="past-2026.html">2026 APDC · ENTRY ARCHIVE</a></header><main class="wrap"><div class="small-label">READ ONLY</div><h1>ENTRY</h1><div class="tools"><input id="q" type="search" placeholder="Search back number / name / event"></div><div id="count" class="muted"></div><div id="rows" class="rows"></div></main><script>let data=[];const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function render(){const q=document.getElementById('q').value.toLowerCase().trim();const f=data.filter(x=>!q||Object.values(x).some(v=>String(v??'').toLowerCase().includes(q)));document.getElementById('count').textContent=f.length+' entries';document.getElementById('rows').innerHTML=f.slice(0,1000).map(x=>`<div class="row"><div class="no">#${esc(x.backNo||'-')}</div><div><strong>${esc(x.competitor||x.name||'-')}</strong><div class="sub">${esc(x.section||'')} ${esc(x.division||'')}</div></div><div class="event"><strong>${esc(x.event||x.eventName||'')}</strong><div class="sub">Event ${esc(x.eventNo||'')}</div></div></div>`).join('')}fetch('archive-2026-players.json').then(r=>r.json()).then(d=>{data=Array.isArray(d)?d:[];render()});document.getElementById('q').addEventListener('input',render)</script></body></html>
