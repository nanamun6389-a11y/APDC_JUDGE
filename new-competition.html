<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>New Competition</title><link rel="stylesheet" href="style.css"><style>.new-wrap{width:min(720px,100%);margin:auto;padding:28px 18px 70px}.new-card{border:1px solid #ccc;padding:22px;background:#fff}.new-card label{display:block;margin:14px 0;font-weight:900;font-size:11px;letter-spacing:.06em}.new-card input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px}.new-actions{display:flex;gap:8px;margin-top:20px}.new-actions button,.new-actions a{flex:1;text-align:center;padding:13px;text-decoration:none}.saved{margin-top:14px;font-weight:900}</style></head><body><header><a class="brand brand-link" href="index.html">APDC COMPETITION SYSTEM</a></header><main class="new-wrap"><div class="small-label">NEW COMPETITION</div><h1>CREATE COMPETITION</h1><p class="muted">새 대회는 별도 데이터로 시작합니다. 2026 APDC 기록은 변경되지 않습니다.</p><section class="new-card"><label>COMPETITION NAME<input id="name" placeholder="2027 APDC"></label><label>DATE<input id="date" type="date"></label><label>VENUE<input id="venue" placeholder="Venue"></label><div class="new-actions"><a class="light" href="index.html">CANCEL</a><button id="create" class="dark" type="button">CREATE DRAFT</button></div><div id="msg" class="saved"></div></section></main><script>document.getElementById('create').onclick=()=>{const n=document.getElementById('name').value.trim();if(!n){document.getElementById('msg').textContent='대회명을 입력해주세요.';return}const draft={id:'comp-'+Date.now(),name:n,date:document.getElementById('date').value,venue:document.getElementById('venue').value.trim(),status:'DRAFT',createdAt:new Date().toISOString()};const all=JSON.parse(localStorage.getItem('apdc-competitions-v1')||'[]');all.push(draft);localStorage.setItem('apdc-competitions-v1',JSON.stringify(all));document.getElementById('msg').textContent='DRAFT가 생성되었습니다. 다음 단계에서 종목·심사위원 설정을 연결합니다.'}</script></body></html>
