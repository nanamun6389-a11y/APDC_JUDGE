<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APDC Certificate Print</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f4f4}.wrap{max-width:1100px;margin:auto;padding:24px}.toolbar{background:#fff;border:1px solid #ccc;padding:18px;margin-bottom:18px}.toolbar select,.toolbar input{width:100%;padding:12px;margin:6px 0 12px}.toolbar button{padding:13px 18px}.list{background:#fff;border:1px solid #ccc}.row{display:grid;grid-template-columns:50px 80px 1fr 1.3fr 90px;gap:8px;padding:12px;border-bottom:1px solid #eee;align-items:center}.cert{position:relative;width:210mm;height:297mm;background:#fff;page-break-after:always;overflow:hidden}.cert img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transform:scale(1.04)}.cover{position:absolute;z-index:2;text-align:center;display:flex;align-items:center;justify-content:center}.name{left:20%;top:41%;width:60%;height:7%;font:700 13mm Georgia;color:#8b5a2b}.event{left:18%;top:64.3%;width:64%;height:5.5%;font:600 5.7mm Georgia;color:#a36b1c}.place{left:30%;top:54%;width:40%;height:7%;font:700 13.5mm Georgia;color:#a36b1c}.batch{display:none}@media print{body>*:not(.batch){display:none!important}.batch{display:block}.cert{box-shadow:none;margin:0}}
</style></head><body><header><a class="brand brand-link" href="admin.html">APDC CERTIFICATE</a></header><main class="wrap"><div class="toolbar"><h1>FINAL RESULTS → CERTIFICATE</h1><div id="meta"></div><label>EVENT<select id="event"></select></label><label><input id="all" type="checkbox"> 전체 선택</label><button id="print">선택 상장 출력</button><span id="msg"></span></div><div id="list" class="list"></div></main><div id="batch" class="batch"></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getDatabase,ref as fbRef,get}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';import{firebaseConfig}from'./firebase-config.js';import{competitionPath,competitionId}from'./competition-context.js';
const db=getDatabase(initializeApp(firebaseConfig));const ref=p=>fbRef(db,competitionPath(p));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const [rs,es,ms]=await Promise.all([get(ref('results')),get(ref('entries')),get(ref('meta'))]);const results=rs.val()||{}, entries=Object.values(es.val()||{}), meta=ms.val()||{};document.getElementById('meta').textContent=`${meta.name||competitionId} ${meta.date?'· '+meta.date:''}`;
const byBack=new Map();entries.forEach(x=>{if(x?.backNo&&!byBack.has(String(x.backNo)))byBack.set(String(x.backNo),x)});const finals=[];Object.entries(results).forEach(([encoded,ev])=>{const f=ev?.final;if(!f?.ranking)return;f.ranking.forEach(r=>{const e=byBack.get(String(r.backNo))||{};finals.push({eventKey:f.eventKey||'',event:f.eventLabel||e.event||encoded,backNo:String(r.backNo),name:e.competitor||String(r.backNo),place:Number(r.place)||0})})});
const sel=document.getElementById('event');const events=[...new Set(finals.map(x=>x.event))].sort();sel.innerHTML='<option value="">ALL EVENTS</option>'+events.map(x=>`<option>${esc(x)}</option>`).join('');function rows(){return finals.filter(x=>!sel.value||x.event===sel.value).sort((a,b)=>a.event.localeCompare(b.event)||a.place-b.place)}function render(){document.getElementById('list').innerHTML=rows().map((r,i)=>`<div class="row"><input type="checkbox" data-i="${i}"><b>${r.backNo}</b><span>${esc(r.name)}</span><span>${esc(r.event)}</span><b>${r.place}</b></div>`).join('')||'<div style="padding:30px">저장된 FINAL 결과가 없습니다.</div>'}render();sel.onchange=render;document.getElementById('all').onchange=e=>document.querySelectorAll('[data-i]').forEach(x=>x.checked=e.target.checked);
const cert=r=>`<section class="cert"><img src="APDC_Certificate_Background_v2.png"><div class="cover name">${esc(r.name)}</div><div class="cover place">${r.place}${r.place===1?'ST':r.place===2?'ND':r.place===3?'RD':'TH'}</div><div class="cover event">${esc(r.event)}</div></section>`;document.getElementById('print').onclick=()=>{const rr=rows(),picked=[...document.querySelectorAll('[data-i]:checked')].map(x=>rr[Number(x.dataset.i)]).filter(Boolean);if(!picked.length)return alert('출력할 결과를 선택하세요.');document.getElementById('batch').innerHTML=picked.map(cert).join('');setTimeout(()=>window.print(),100)};
</script></body></html>
