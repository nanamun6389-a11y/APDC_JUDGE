<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Competition Setup</title><link rel="stylesheet" href="style.css"><style>
.wrap{width:min(760px,100%);margin:auto;padding:28px 18px 70px}.card{border:1px solid #ccc;padding:22px;background:#fff}.title{font-size:clamp(34px,8vw,62px);line-height:.95;margin:24px 0}.meta{background:#f4f4f4;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.grid a{border:1px solid #111;padding:18px 12px;text-decoration:none;color:#111;font-weight:900;text-align:center}.grid a.primary{background:#000;color:#fff}.back{display:inline-block;margin-top:20px;color:#111;font-weight:800;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header><a class="brand brand-link" href="index.html">APDC COMPETITION SYSTEM</a></header><main class="wrap"><div class="small-label">COMPETITION SETUP</div><h1 class="title">COMPETITION SETUP</h1><p class="muted">엔트리 등록 후 타임테이블을 만들고, 마지막에 SEARCH 송출을 진행하세요.</p><section class="card"><div class="small-label">ACTIVE COMPETITION</div><div id="meta" class="meta">불러오는 중...</div><div class="grid"><a id="admin" class="primary">ENTRIES / TIMETABLE</a><a id="judge">JUDGE SCREEN</a><a id="control">CONTROL ROOM</a><a id="mc">MC SCREEN</a><a id="timetable">TIMETABLE</a><a id="home">SYSTEM HOME</a></div><a class="back" href="new-competition.html">← CREATE ANOTHER COMPETITION</a></section></main><script type="module">
import { getActiveCompetition, setActiveCompetition } from './competition-context.js';
const qs=new URL(location.href).searchParams;const id=qs.get('competition')||getActiveCompetition()||'2026-apdc';setActiveCompetition(id);
let all=[];try{all=JSON.parse(localStorage.getItem('apdc-competitions-v2')||'[]');if(!Array.isArray(all))all=[]}catch(e){all=[]}const c=all.find(x=>x&&x.id===id)||{id,name:id,date:'',venue:''};
document.getElementById('meta').innerHTML=`<strong>${c.name||id}</strong><br>${c.date||''}${c.venue?' · '+c.venue:''}<br><small>${id}</small>`;
[['admin','admin.html'],['judge','judge-live.html'],['control','control-room.html'],['mc','mc.html'],['timetable','timetable.html'],['home','index.html']].forEach(([el,page])=>document.getElementById(el).href=`${page}?competition=${encodeURIComponent(id)}`);
</script></body></html>
