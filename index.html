<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>APDC Competition System</title><link rel="stylesheet" href="style.css">
<style>.comp-main{width:min(980px,100%);margin:0 auto;padding:32px 18px 70px}.comp-hero{padding:30px 0 22px;border-bottom:2px solid #111}.comp-hero h1{font-size:clamp(34px,7vw,64px);margin:6px 0}.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.comp-card{border:1px solid #bbb;background:#fff;padding:22px;text-decoration:none;color:#111;display:block}.comp-card strong{display:block;font-size:22px;margin:7px 0}.comp-card p{margin:0;color:#666;font-size:13px;line-height:1.6}.comp-card.primary{background:#111;color:#fff}.comp-card.primary p{color:#ddd}.past-title{margin:38px 0 12px;font-size:12px;letter-spacing:.12em}.archive-row{border:1px solid #ccc;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;color:#111}.active-row{border:1px solid #ccc;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff}.active-main{min-width:0;flex:1}.active-actions{display:flex;gap:8px;align-items:center}.action-open,.action-edit,.action-delete{font:inherit;font-size:10px;font-weight:900;letter-spacing:.08em;border:1px solid #111;padding:8px 10px;background:#fff;color:#111;text-decoration:none;cursor:pointer}.action-edit{border-color:#111;color:#111}.action-delete{border-color:#999;color:#555}.action-delete:disabled{opacity:.45;cursor:wait}.archive-row .tag{font-size:10px;font-weight:900;letter-spacing:.08em;border:1px solid #111;padding:5px 7px}.archive-row h2{margin:2px 0 4px;font-size:20px}.archive-row p{margin:0;color:#666;font-size:12px}.active-list{display:grid;gap:10px;margin-top:12px}.loading{padding:18px;border:1px solid #ddd;color:#777}.newbtn{margin-top:12px;display:block;text-align:center;border:1px solid #111;padding:15px;text-decoration:none;color:#111;font-weight:900}@media(max-width:680px){.comp-grid{grid-template-columns:1fr}.comp-main{padding-top:18px}}</style></head><body>
<header style="position:relative"><a class="brand brand-link" href="index.html">APDC COMPETITION SYSTEM</a></header><main class="comp-main"><section class="comp-hero"><div class="small-label">COMPETITION MANAGEMENT</div><h1>APDC JUDGE</h1><p class="muted">진행 중인 대회를 불러와 이어서 작업하거나 새 대회를 만듭니다.</p></section>
<div class="home-quick-actions" style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><a class="newbtn" style="margin:0;flex:1;min-width:180px" href="judge-live.html">JUDGE LOGIN · 심사</a></div><div class="past-title">ACTIVE COMPETITIONS · 진행 중인 대회</div><div id="activeList" class="active-list"><div class="loading">Firebase에서 대회를 불러오는 중...</div></div><a class="newbtn" href="new-competition.html">+ 새 대회 만들기 · ADMIN</a>
<div class="past-title">PAST COMPETITIONS · 지난 대회</div><a class="archive-row" href="past-2026.html"><div><div class="small-label">AUGUST 8, 2026</div><h2>2026 APDC</h2><p>엔트리 · 타임테이블 · 최종 결과 보관본</p></div><span class="tag">READ ONLY</span></a></main>
<script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import {getDatabase,ref,get,remove,set,update} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';import {firebaseConfig} from './firebase-config.js';import {setActiveCompetition} from './competition-context.js';
const host=document.getElementById('activeList');async function sha256(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
try{const db=getDatabase(initializeApp(firebaseConfig));const snap=await get(ref(db,'competitions'));const data=snap.val()||{};const local=(()=>{try{return JSON.parse(localStorage.getItem('apdc-competitions-v2')||'[]')}catch{return[]}})();const rows=Object.entries(data).filter(([id])=>id!=='2026-apdc').map(([id,v])=>{const lm=Array.isArray(local)?local.find(x=>x&&x.id===id):null;const meta=(v&&v.meta)||lm||{};const entries=v&&v.entries?Object.keys(v.entries).length:0;const tt=v&&v.timetableOverride?(Array.isArray(v.timetableOverride)?v.timetableOverride.length:Object.keys(v.timetableOverride).length):0;return{id,name:meta.name||id,date:meta.date||'',venue:meta.venue||'',entries,tt}});if(!rows.length){host.innerHTML='<div class="loading">진행 중인 대회가 없습니다. 아래에서 새 대회를 만들어주세요.</div>'}else{host.innerHTML=rows.map(r=>`<div class="active-row" data-id="${esc(r.id)}"><div class="active-main"><div class="small-label">${esc(r.date||'IN PROGRESS')}</div><h2>${esc(r.name)}</h2><p>${r.entries} ENTRIES · 저장된 작업 계속하기</p></div><div class="active-actions"><a class="action-open activeCompetition" data-id="${esc(r.id)}" href="admin.html?competition=${encodeURIComponent(r.id)}&tab=entries">OPEN</a><button class="action-edit editCompetition" type="button" data-id="${esc(r.id)}" data-name="${esc(r.name)}" data-date="${esc(r.date)}" data-venue="${esc(r.venue)}">EDIT</button><button class="action-delete deleteCompetition" type="button" data-id="${esc(r.id)}" data-name="${esc(r.name)}">DELETE</button></div></div>`).join('');host.querySelectorAll('.activeCompetition').forEach(a=>a.addEventListener('click',()=>setActiveCompetition(a.dataset.id)));host.querySelectorAll('.editCompetition').forEach(btn=>btn.addEventListener('click',async()=>{const id=btn.dataset.id;if(id==='2026-apdc')return;const currentName=btn.dataset.name||id;const currentDate=btn.dataset.date||'';const currentVenue=btn.dataset.venue||'';const name=prompt('대회 이름을 수정하세요.',currentName);if(name===null)return;const cleanName=name.trim();if(!cleanName){alert('대회 이름을 입력해주세요.');return}const date=prompt('대회 날짜를 YYYY-MM-DD 형식으로 수정하세요.',currentDate);if(date===null)return;const cleanDate=date.trim();if(cleanDate&&!/^\d{4}-\d{2}-\d{2}$/.test(cleanDate)){alert('날짜는 YYYY-MM-DD 형식으로 입력해주세요.');return}const venue=prompt('대회 장소를 수정하세요.',currentVenue);if(venue===null)return;btn.disabled=true;btn.textContent='SAVING…';try{await update(ref(db,`competitions/${id}/meta`),{name:cleanName,date:cleanDate,venue:venue.trim(),updatedAt:Date.now()});try{const key='apdc-competitions-v2';const arr=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(arr)){const i=arr.findIndex(x=>x&&x.id===id);const meta={id,name:cleanName,date:cleanDate,venue:venue.trim()};if(i>=0)arr[i]={...arr[i],...meta};else arr.push(meta);localStorage.setItem(key,JSON.stringify(arr))}}catch{};location.reload()}catch(err){console.error(err);alert('수정하지 못했습니다. Firebase 규칙 또는 인터넷 연결을 확인해주세요.');btn.disabled=false;btn.textContent='EDIT'}}));host.querySelectorAll('.deleteCompetition').forEach(btn=>btn.addEventListener('click',async()=>{const id=btn.dataset.id;const name=btn.dataset.name||id;if(id==='2026-apdc')return;const metaSnap=await get(ref(db,`competitions/${id}/meta`));const meta=metaSnap.val()||{};if(meta.passwordProtectionVersion===1 && meta.adminPasswordHash){const pw=prompt(`“${name}” 대회 삭제 비밀번호를 입력하세요.`);if(pw===null)return;if(await sha256(pw)!==meta.adminPasswordHash){alert('비밀번호가 맞지 않습니다. 삭제하지 않았습니다.');return}}const ok=confirm(`“${name}” 대회를 삭제할까요?\n\n저장된 엔트리, 타임테이블, 경기 설정이 모두 삭제됩니다. 이 작업은 되돌릴 수 없습니다.`);if(!ok)return;btn.disabled=true;btn.textContent='DELETING…';try{await Promise.all([remove(ref(db,`competitions/${id}`)),remove(ref(db,`publishedCompetitions/${id}`))]);try{const key='apdc-competitions-v2';const arr=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(arr))localStorage.setItem(key,JSON.stringify(arr.filter(x=>!x||x.id!==id)));if(localStorage.getItem('apdc-active-competition-v2')===id)localStorage.removeItem('apdc-active-competition-v2')}catch{};location.reload()}catch(err){console.error(err);alert('삭제하지 못했습니다. Firebase 규칙 또는 인터넷 연결을 확인해주세요.');btn.disabled=false;btn.textContent='DELETE'}}))}}catch(e){console.error(e);host.innerHTML='<div class="loading">대회 목록을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.</div>'}
</script></body></html>
